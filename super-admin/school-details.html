<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Details | Super Admin | SchoolFood</title>
  <meta name="description" content="School profile, grades, canteens, and users.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><a href="schools.html" data-i18n="schools">Schools</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" id="sdCrumb" data-i18n="details">Details</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-building" aria-hidden="true"></i> School profile</p>
            <h1 id="sdName">School</h1>
            <p id="sdMeta">—</p>
            <div id="sdStatus" class="mt-2"></div>
          </div>
          <div class="page-actions">
            <a href="schools.html" class="btn-app btn-outline-app">
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
              <span data-i18n="schools">Schools</span>
            </a>
            <button type="button" class="btn-app btn-primary-app" id="btnToggleSchool">
              <i class="bi bi-toggle-on" aria-hidden="true"></i>
              <span data-i18n="toggleStatus">Toggle status</span>
            </button>
          </div>
        </div>

        <div class="stat-grid parent-home-stats" data-aos="fade-up">
          <div class="stat-card stat-card--navy">
            <div class="stat-card-label">
              <span data-i18n="grades">Grades</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-mortarboard"></i></span>
            </div>
            <div class="stat-card-value" id="sdStatGrades">0</div>
          </div>
          <div class="stat-card stat-card--teal">
            <div class="stat-card-label">
              <span data-i18n="classes">Classes</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-grid-3x3-gap"></i></span>
            </div>
            <div class="stat-card-value" id="sdStatClasses">0</div>
          </div>
          <div class="stat-card stat-card--sky">
            <div class="stat-card-label">
              <span data-i18n="canteens">Canteens</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-shop-window"></i></span>
            </div>
            <div class="stat-card-value" id="sdStatCanteens">0</div>
          </div>
          <div class="stat-card stat-card--coral">
            <div class="stat-card-label">
              <span data-i18n="students">Students</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-people"></i></span>
            </div>
            <div class="stat-card-value" id="sdStatStudents">0</div>
          </div>
        </div>

        <div class="tabs-app settings-tabs" role="tablist">
          <button type="button" class="tab-btn active" data-tab="overview" data-i18n="overview">Overview</button>
          <button type="button" class="tab-btn" data-tab="grades" data-i18n="grades">Grades</button>
          <button type="button" class="tab-btn" data-tab="canteens" data-i18n="canteens">Canteens</button>
          <button type="button" class="tab-btn" data-tab="users" data-i18n="users">Users</button>
        </div>

        <div class="tab-panel active" id="panel-overview">
          <div class="settings-layout" data-aos="fade-up">
            <aside class="settings-card settings-profile-card">
              <div class="settings-profile-avatar" aria-hidden="true"><i class="bi bi-building"></i></div>
              <h3 id="sdProfileName">School</h3>
              <p class="settings-profile-role" data-i18n="school">School</p>
              <p class="settings-profile-email" id="sdProfileEmail">—</p>
              <ul class="settings-profile-meta">
                <li><i class="bi bi-geo-alt" aria-hidden="true"></i> <span id="sdProfileCity">—</span></li>
                <li><i class="bi bi-telephone" aria-hidden="true"></i> <span id="sdProfilePhone">—</span></li>
                <li><i class="bi bi-clock" aria-hidden="true"></i> <span id="sdProfileTz">—</span></li>
              </ul>
            </aside>
            <div class="settings-forms">
              <section class="settings-card">
                <h3><i class="bi bi-info-circle" aria-hidden="true"></i> <span data-i18n="school">School</span></h3>
                <div class="row g-3">
                  <div class="col-md-6">
                    <ul class="info-list">
                      <li><span class="label" data-i18n="currency">Currency</span><span class="value" id="sdCurrency">—</span></li>
                      <li><span class="label" data-i18n="timezone">Timezone</span><span class="value" id="sdTimezone">—</span></li>
                      <li><span class="label" data-i18n="weekdays">School Days</span><span class="value" id="sdDays">—</span></li>
                    </ul>
                  </div>
                  <div class="col-md-6">
                    <ul class="info-list">
                      <li><span class="label" data-i18n="advanceOrderDays">Advance order days</span><span class="value" id="sdAdvance">—</span></li>
                      <li><span class="label" data-i18n="cancelDeadlineHours">Cancel deadline</span><span class="value" id="sdCancel">—</span></li>
                      <li><span class="label" data-i18n="status">Status</span><span class="value" id="sdStatusInline">—</span></li>
                    </ul>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-grades">
          <div class="filters-bar mb-3" data-aos="fade-up">
            <div class="search-box">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input type="search" id="sdGradeSearch" data-i18n-placeholder="search" placeholder="Search grades">
            </div>
          </div>
          <div class="card-app" data-aos="fade-up">
            <div class="card-app-header">
              <h3><i class="bi bi-mortarboard" aria-hidden="true"></i> <span data-i18n="gradesClasses">Grades &amp; Classes</span></h3>
            </div>
            <div class="card-app-body" id="tabGrades"></div>
          </div>
        </div>

        <div class="tab-panel" id="panel-canteens">
          <div class="filters-bar mb-3" data-aos="fade-up">
            <div class="filter-select">
              <select id="sdCanteenStatus" class="select2-field" data-placeholder="Status">
                <option value="all">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div class="canteen-grid" id="tabCanteens"></div>
        </div>

        <div class="tab-panel" id="panel-users">
          <div class="row g-3" id="tabUsers"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/super-admin.js"></script>
  <script>$(function () { SuperAdminApp.initSchoolDetails(); });</script>
</body>
</html>
