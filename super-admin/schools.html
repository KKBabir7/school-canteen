<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schools | Super Admin | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">

<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1 data-i18n="schools">Schools</h1>
        <p data-i18n="schoolsDesc">Create and manage schools on the platform.</p>
      </div>
      <button type="button" class="btn-app btn-primary-app" id="btnAddSchool" data-i18n="addSchool">Add School</button>
    </div>

    <div class="card-app" data-aos="fade-up">
      <div class="card-app-body p-0">
        <div class="table-responsive">
          <table class="table-app mb-0">
            <thead>
              <tr>
                <th data-i18n="name">Name</th>
                <th data-i18n="email">Email</th>
                <th data-i18n="status">Status</th>
                <th class="text-end" data-i18n="actions">Actions</th>
              </tr>
            </thead>
            <tbody id="schoolsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div></div></div>

  <script>$(function(){ SuperAdminApp.initSchools(); });</script>
