<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Super Admin | SchoolFood</title>
  <meta name="description" content="Super admin dashboard — schools overview.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1 data-i18n="dashboard">Dashboard</h1>
        <p data-i18n="welcomeSuperAdmin">Platform overview for all schools.</p>
      </div>
      <a href="schools.html" class="btn-app btn-primary-app" data-i18n="schools">Schools</a>
    </div>

    <div class="stat-grid">
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="totalSchools">Total schools</span></div>
        <div class="stat-card-value" id="suTotal">0</div>
      </div>
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="active">Active</span></div>
        <div class="stat-card-value" id="suActive">0</div>
      </div>
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="inactive">Inactive</span></div>
        <div class="stat-card-value" id="suInactive">0</div>
      </div>
    </div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/super-admin.js"></script>
  <script>$(function(){ SuperAdminApp.initDashboard(); });</script>
</body>
</html>
