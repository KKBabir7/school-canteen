<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discounts | Canteen Manager | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb-app">
        <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
        <li class="separator" aria-hidden="true">/</li>
        <li><span class="current" data-i18n="discounts">Discounts</span></li>
      </ol>
    </nav>

    <div class="page-header page-header--panel">
      <div class="page-header-text">
        <p class="page-kicker"><i class="bi bi-percent" aria-hidden="true"></i> Promotions</p>
        <h1 data-i18n="discounts">Discounts</h1>
        <p data-i18n="discountsDesc">Manage canteen discounts when permitted.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn-app btn-primary-app" id="btnAddDiscount">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> <span data-i18n="addDiscount">Add Discount</span>
        </button>
      </div>
    </div>

    <div id="discountsList"></div>
  </div></div></div>

  <div class="modal fade modal-app" id="discountModal" tabindex="-1" aria-labelledby="discountModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <span class="modal-title-icon" aria-hidden="true"><i class="bi bi-percent"></i></span>
            <div>
              <h2 class="modal-title" id="discountModalLabel" data-i18n="addDiscount">Add Discount</h2>
              <p class="modal-subtitle">Create a bilingual discount for this canteen</p>
            </div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="dNameEn">Name — English <span class="required">*</span></label>
            <input type="text" id="dNameEn" class="form-control-app" autocomplete="off">
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="dNameAr">Name — Arabic</label>
            <input type="text" id="dNameAr" class="form-control-app" dir="rtl" autocomplete="off">
          </div>
          <div class="row g-2">
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="dType">Type</label>
              <select id="dType" class="select2-field" data-placeholder="Select type">
                <option value="percent">Percent (%)</option>
                <option value="fixed">Fixed amount</option>
              </select>
            </div>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="dVal">Value <span class="required">*</span></label>
              <input type="number" id="dVal" class="form-control-app" min="0" step="1" value="10">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnSaveDiscount">
            <i class="bi bi-check2-circle" aria-hidden="true"></i> <span data-i18n="save">Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/discount-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function(){ SoonFeatures.initDiscounts(); });</script>
</body>
</html>
