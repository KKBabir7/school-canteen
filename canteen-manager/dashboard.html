<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Canteen Manager | SchoolFood</title>
  <meta name="description" content="Canteen Manager dashboard — today's menu, order stats, and quick actions for lunch service.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><span class="current">Dashboard</span></li>
          </ol>
        </nav>

        <div class="welcome-banner" data-aos="fade-up">
          <h2 id="cmWelcome">Good morning</h2>
          <p>Run today's service for your canteen — menu, availability, and orders.</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card" data-aos="fade-up">
            <div class="stat-card-label">New Orders <span class="stat-card-icon info"><i class="bi bi-bell" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statNewOrders">0</div>
          </div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="50">
            <div class="stat-card-label">Preparing <span class="stat-card-icon warning"><i class="bi bi-hourglass-split" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statPreparing">0</div>
          </div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="100">
            <div class="stat-card-label">Ready <span class="stat-card-icon success"><i class="bi bi-bag-check" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statReady">0</div>
          </div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="150">
            <div class="stat-card-label">Today's Orders <span class="stat-card-icon"><i class="bi bi-calendar-day" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statTodayOrders">0</div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card-app mb-4" data-aos="fade-up">
              <div class="card-app-header">
                <h3>Today's menu</h3>
                <a href="my-menus.html" class="btn-app btn-outline-app btn-sm-app">Manage</a>
              </div>
              <div class="card-app-body">
                <div class="food-grid" id="todayMenuGrid"></div>
              </div>
            </div>

            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header">
                <h3>Today's order summary</h3>
                <a href="orders.html" class="btn-app btn-outline-app btn-sm-app">All orders</a>
              </div>
              <div class="card-app-body" id="todayOrdersSummary"></div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header"><h3>Quick actions</h3></div>
              <div class="card-app-body">
                <div class="quick-actions">
                  <a href="orders.html" class="quick-action-btn">
                    <i class="bi bi-bag-check" aria-hidden="true"></i>
                    <span>View Orders</span>
                  </a>
                  <a href="my-menus.html" class="quick-action-btn">
                    <i class="bi bi-journal-richtext" aria-hidden="true"></i>
                    <span>Manage Menu</span>
                  </a>
                  <a href="my-menus.html?menu=menu-1" class="quick-action-btn">
                    <i class="bi bi-slash-circle" aria-hidden="true"></i>
                    <span>Mark Item Unavailable</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/canteen-manager.js"></script>
  <script>
    $(function () {
      const user = SchoolFoodMock.users.canteenManager;
      $('#cmWelcome').text(AppState.greeting() + ', ' + user.name.split(' ')[0] + ' 👋');
      CanteenManager.initDashboard();
    });
  </script>
</body>
</html>
