<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Canteen Manager | SchoolFood</title>
  <meta name="description" content="Canteen Manager dashboard — today's menu, orders, and revenue.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb-app"><li><span class="current" data-i18n="dashboard">Dashboard</span></li></ol></nav>

        <div class="welcome-banner" data-aos="fade-up">
          <h2 id="cmWelcome">Good morning</h2>
          <p data-i18n="welcomeCm">Run today's service for your canteen.</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card"><div class="stat-card-label" data-i18n="todayOrders">Today's Orders</div><div class="stat-card-value" id="statTodayOrders">0</div></div>
          <div class="stat-card"><div class="stat-card-label" data-i18n="newOrders">New Orders</div><div class="stat-card-value" id="statNewOrders">0</div></div>
          <div class="stat-card"><div class="stat-card-label" data-i18n="preparing">Preparing</div><div class="stat-card-value" id="statPreparing">0</div></div>
          <div class="stat-card"><div class="stat-card-label" data-i18n="ready">Ready</div><div class="stat-card-value" id="statReady">0</div></div>
          <div class="stat-card"><div class="stat-card-label" data-i18n="revenue">Today's Revenue</div><div class="stat-card-value" id="statRevenue">0</div></div>
          <div class="stat-card"><div class="stat-card-label" data-i18n="availableItems">Available Items</div><div class="stat-card-value" id="statAvailableItems">0</div></div>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card-app mb-4">
              <div class="card-app-header"><h3 data-i18n="todayMenu">Today's Menu</h3><a href="my-menu.html" class="btn-app btn-outline-app btn-sm-app" data-i18n="manageMenu">Manage</a></div>
              <div class="card-app-body"><div class="food-grid" id="todayMenuGrid"></div></div>
            </div>
            <div class="card-app">
              <div class="card-app-header"><h3 data-i18n="orders">Recent Orders</h3><a href="orders.html" class="btn-app btn-outline-app btn-sm-app" data-i18n="viewOrders">View Orders</a></div>
              <div class="card-app-body" id="todayOrdersSummary"></div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card-app">
              <div class="card-app-header"><h3 data-i18n="quickActions">Quick actions</h3></div>
              <div class="card-app-body">
                <div class="quick-actions">
                  <a href="orders.html" class="quick-action-btn"><i class="bi bi-bag-check"></i><span data-i18n="viewOrders">View Orders</span></a>
                  <a href="my-menu.html" class="quick-action-btn"><i class="bi bi-journal-richtext"></i><span data-i18n="manageMenu">Manage Menu</span></a>
                  <a href="my-menu.html?menu=menu-1" class="quick-action-btn"><i class="bi bi-slash-circle"></i><span data-i18n="markUnavailable">Mark Unavailable</span></a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/canteen-manager.js"></script>
  <script>$(function () { CanteenManager.initDashboard(); });</script>
</body>
</html>
