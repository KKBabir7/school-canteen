<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | Canteen Manager | SchoolFood</title>
  <meta name="description" content="View order items, update status, and print a pickup ticket.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
  <style>@media print { .no-print { display: none !important; } .print-only { display: block !important; } } .print-only { display: none; }</style>
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb" class="no-print"><ol class="breadcrumb-app"><li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li><li class="separator">/</li><li><a href="orders.html" data-i18n="orders">Orders</a></li><li class="separator">/</li><li><span class="current">Details</span></li></ol></nav>

        <div class="detail-header no-print" data-aos="fade-up">
          <div>
            <h1 id="odNumber">#—</h1>
            <div class="detail-meta">
              <span><i class="bi bi-person"></i> <span id="odStudent">—</span></span>
              <span><i class="bi bi-mortarboard"></i> <span id="odClassroom">—</span></span>
              <span><i class="bi bi-clock"></i> <span id="odTime">—</span></span>
              <span id="odStatus"></span>
            </div>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-outline-app" id="btnPrintOrder"><i class="bi bi-printer"></i> <span data-i18n="printOrder">Print Order</span></button>
          </div>
        </div>

        <div class="card-app mb-4 no-print">
          <div class="card-app-header"><h3 data-i18n="status">Status</h3></div>
          <div class="card-app-body">
            <div id="odStepper"></div>
            <div id="odActions" class="mt-3"></div>
          </div>
        </div>

        <div class="card-app no-print">
          <div class="card-app-header"><h3 data-i18n="items">Order items</h3></div>
          <div class="card-app-body">
            <div id="odItems"></div>
            <div class="d-flex justify-content-between pt-3 mt-2 border-top">
              <strong data-i18n="total">Total</strong>
              <strong class="fs-5" id="odTotal">₪0</strong>
            </div>
          </div>
        </div>

        <div class="print-only p-4" id="printArea">
          <h1>SchoolFood Order</h1>
          <p><strong>Order</strong> <span id="printOrderNumber"></span></p>
          <p><strong>Student</strong> <span id="printStudent"></span></p>
          <p><strong>Class</strong> <span id="printClass"></span></p>
          <p><strong>Time</strong> <span id="printTime"></span></p>
          <hr>
          <div id="printItems"></div>
          <p class="text-end fs-5"><strong>Total: <span id="printTotal"></span></strong></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script>$(function () { Orders.initOrderDetails(); });</script>
</body>
</html>
