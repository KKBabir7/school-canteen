<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | Canteen Manager | SchoolFood</title>
  <meta name="description" content="View order items, update status, and print a pickup ticket.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
  <style>
    @media print {
      body * { visibility: hidden; }
      .print-order, .print-order * { visibility: visible; }
      .print-order { position: absolute; left: 0; top: 0; width: 100%; padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content" id="orderDetailRoot">
        <nav aria-label="Breadcrumb" class="no-print">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><a href="orders.html">Orders</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current">Details</span></li>
          </ol>
        </nav>

        <div class="detail-header no-print" data-aos="fade-up">
          <div>
            <h1 id="orderNumber">#—</h1>
            <div class="detail-meta">
              <span><i class="bi bi-person" aria-hidden="true"></i> <span id="orderStudent">—</span></span>
              <span><i class="bi bi-mortarboard" aria-hidden="true"></i> Grade <span id="orderClass">—</span></span>
              <span><i class="bi bi-clock" aria-hidden="true"></i> <span id="orderTime">—</span></span>
              <span id="orderStatusBadge"></span>
            </div>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-outline-app" id="btnPrintOrder">
              <i class="bi bi-printer" aria-hidden="true"></i> Print Order
            </button>
          </div>
        </div>

        <div class="card-app mb-4 no-print" data-aos="fade-up">
          <div class="card-app-header"><h3>Status</h3></div>
          <div class="card-app-body">
            <div id="orderStepper"></div>
            <div id="orderPrimaryAction" class="mt-3"></div>
          </div>
        </div>

        <div class="card-app no-print" data-aos="fade-up">
          <div class="card-app-header"><h3>Order items</h3></div>
          <div class="card-app-body">
            <div id="orderItems"></div>
            <div class="d-flex justify-content-between align-items-center pt-3 mt-2">
              <strong>Total</strong>
              <strong class="fs-5 text-primary" id="orderTotal">₪0</strong>
            </div>
          </div>
        </div>

        <!-- Print-only view -->
        <div class="print-order print-only">
          <h1 style="font-family:Outfit,sans-serif;margin-bottom:0.5rem">SchoolFood Order</h1>
          <p><strong>Order</strong> <span id="printOrderNumber"></span></p>
          <p><strong>Student</strong> <span id="printStudent"></span></p>
          <p><strong>Class</strong> <span id="printClass"></span></p>
          <p><strong>Time</strong> <span id="printTime"></span></p>
          <hr>
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:8px 0;border-bottom:1px solid #ccc">Item</th>
                <th style="text-align:left;padding:8px 0;border-bottom:1px solid #ccc">Qty</th>
                <th style="text-align:right;padding:8px 0;border-bottom:1px solid #ccc">Price</th>
              </tr>
            </thead>
            <tbody id="printItems"></tbody>
          </table>
          <p style="text-align:right;margin-top:1rem;font-size:1.25rem"><strong>Total: <span id="printTotal"></span></strong></p>
        </div>
      </div>
    </div>
  </div>

  <div class="mobile-bottom-bar no-print">
    <div id="mobileOrderAction" class="w-100"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script>
    $(function () {
      Orders.initOrderDetails();
      // Mirror primary action to mobile bar
      const syncMobile = () => {
        $('#mobileOrderAction').html($('#orderPrimaryAction').html());
        $('#mobileOrderAction #btnStatusAction').on('click', function () {
          $('#orderPrimaryAction #btnStatusAction').trigger('click');
        });
      };
      syncMobile();
      const obs = new MutationObserver(syncMobile);
      const el = document.getElementById('orderPrimaryAction');
      if (el) obs.observe(el, { childList: true });
    });
  </script>
</body>
</html>
