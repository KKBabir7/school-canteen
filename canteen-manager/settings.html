<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Canteen Manager | SchoolFood</title>
  <meta name="description" content="Configure canteen details, ordering rules, and notification preferences.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current">Settings</span></li>
          </ol>
        </nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1>Settings</h1>
            <p>Basic canteen, ordering, and notification preferences.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-primary-app" id="btnSaveSettings">Save changes</button>
          </div>
        </div>

        <div class="tabs-app" role="tablist" data-aos="fade-up">
          <button type="button" class="tab-btn active" data-tab="canteen" role="tab" aria-selected="true">Canteen</button>
          <button type="button" class="tab-btn" data-tab="ordering" role="tab" aria-selected="false">Ordering</button>
          <button type="button" class="tab-btn" data-tab="notifications" role="tab" aria-selected="false">Notifications</button>
        </div>

        <div class="tab-panel active" id="panel-canteen" role="tabpanel">
          <div class="settings-card" style="max-width:560px" data-aos="fade-up">
            <h3>Canteen</h3>
            <p class="settings-desc">Identity and contact details for this location.</p>
            <div class="form-group-app">
              <label class="form-label-app" for="setCanteenName">Name</label>
              <input type="text" id="setCanteenName" class="form-control-app">
            </div>
            <div class="form-group-app">
              <label class="form-label-app" for="setCanteenPhone">Phone</label>
              <input type="tel" id="setCanteenPhone" class="form-control-app">
            </div>
            <div class="form-group-app">
              <label class="form-label-app" for="setCanteenEmail">Email</label>
              <input type="email" id="setCanteenEmail" class="form-control-app">
            </div>
            <div class="form-group-app mb-0">
              <label class="toggle-app">
                <input type="checkbox" id="setCanteenActive">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-label">Active</span>
              </label>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-ordering" role="tabpanel">
          <div class="settings-card" style="max-width:560px">
            <h3>Ordering</h3>
            <p class="settings-desc">Rules that control when and how orders are accepted.</p>
            <div class="form-group-app">
              <label class="toggle-app">
                <input type="checkbox" id="setAllowSameDay">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-label">Allow same-day ordering</span>
              </label>
            </div>
            <div class="form-group-app">
              <label class="form-label-app" for="setLastOrderTime">Default last order time</label>
              <input type="time" id="setLastOrderTime" class="form-control-app">
            </div>
            <div class="form-group-app">
              <label class="form-label-app" for="setStopWindow">Time window before canteen stops receiving orders (minutes)</label>
              <input type="number" id="setStopWindow" class="form-control-app" min="0" max="180">
            </div>
            <div class="form-group-app mb-0">
              <label class="form-label-app" for="setMaxQty">Maximum quantity per item</label>
              <input type="number" id="setMaxQty" class="form-control-app" min="1" max="20">
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-notifications" role="tabpanel">
          <div class="settings-card" style="max-width:560px">
            <h3>Notifications</h3>
            <p class="settings-desc">Choose which events should notify canteen staff.</p>
            <div class="check-list">
              <label class="check-item">
                <input type="checkbox" id="notifNewOrder">
                <span>New order received</span>
              </label>
              <label class="check-item">
                <input type="checkbox" id="notifCancelled">
                <span>Order cancelled</span>
              </label>
              <label class="check-item">
                <input type="checkbox" id="notifUnavailable">
                <span>Item unavailable</span>
              </label>
              <label class="check-item">
                <input type="checkbox" id="notifDaily">
                <span>Daily summary</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/canteen-manager.js"></script>
  <script>$(function () { CanteenManager.initSettings(); });</script>
</body>
</html>
