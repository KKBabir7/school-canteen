<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Canteen Manager | SchoolFood</title>
  <meta name="description" content="Canteen, ordering, notifications, and account settings.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb-app"><li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li><li class="separator">/</li><li><span class="current" data-i18n="settings">Settings</span></li></ol></nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1 data-i18n="settings">Settings</h1>
            <p data-i18n="settingsDesc">Basic preferences for this canteen.</p>
          </div>
          <div class="page-actions"><button type="button" class="btn-app btn-primary-app" id="btnSaveSettings" data-i18n="saveChanges">Save changes</button></div>
        </div>

        <div class="tabs-app" role="tablist">
          <button type="button" class="tab-btn active" data-tab="canteen" data-i18n="myCanteen">Canteen</button>
          <button type="button" class="tab-btn" data-tab="ordering" data-i18n="ordering">Ordering</button>
          <button type="button" class="tab-btn" data-tab="notifications" data-i18n="notifications">Notifications</button>
          <button type="button" class="tab-btn" data-tab="account" data-i18n="account">Account</button>
        </div>

        <div class="tab-panel active" id="panel-canteen">
          <div class="settings-card" style="max-width:560px">
            <h3 data-i18n="myCanteen">Canteen</h3>
            <div class="form-group-app"><label class="form-label-app" for="setCanteenName" data-i18n="name">Name</label><input type="text" id="setCanteenName" class="form-control-app"></div>
            <div class="form-group-app"><label class="form-label-app" for="setCanteenPhone" data-i18n="phone">Phone</label><input type="tel" id="setCanteenPhone" class="form-control-app"></div>
            <div class="form-group-app"><label class="form-label-app" for="setCanteenEmail" data-i18n="email">Email</label><input type="email" id="setCanteenEmail" class="form-control-app"></div>
            <label class="toggle-app"><input type="checkbox" id="setCanteenActive"><span class="toggle-track"></span><span data-i18n="active">Active</span></label>
          </div>
        </div>

        <div class="tab-panel" id="panel-ordering">
          <div class="settings-card" style="max-width:560px">
            <h3 data-i18n="ordering">Ordering</h3>
            <label class="toggle-app"><input type="checkbox" id="setAllowSameDay"><span class="toggle-track"></span><span>Allow same-day ordering</span></label>
            <div class="form-group-app"><label class="form-label-app" for="setLastOrderTime">Last order time</label><input type="time" id="setLastOrderTime" class="form-control-app"></div>
            <div class="form-group-app"><label class="form-label-app" for="setStopWindow">Stop window (minutes)</label><input type="number" id="setStopWindow" class="form-control-app" min="0"></div>
            <div class="form-group-app"><label class="form-label-app" for="setMaxQty">Max quantity per item</label><input type="number" id="setMaxQty" class="form-control-app" min="1"></div>
          </div>
        </div>

        <div class="tab-panel" id="panel-notifications">
          <div class="settings-card" style="max-width:560px">
            <h3 data-i18n="notifications">Notifications</h3>
            <label class="check-item d-block mb-2"><input type="checkbox" id="setNotifNew"> New order received</label>
            <label class="check-item d-block mb-2"><input type="checkbox" id="setNotifCancelled"> Order cancelled</label>
            <label class="check-item d-block mb-2"><input type="checkbox" id="setNotifUnavailable"> Item unavailable</label>
            <label class="check-item d-block"><input type="checkbox" id="setNotifSummary"> Daily summary</label>
          </div>
        </div>

        <div class="tab-panel" id="panel-account">
          <div class="settings-card" style="max-width:560px">
            <h3 data-i18n="account">Account</h3>
            <p class="text-muted small" id="cmAccountHint">Demo canteen manager account</p>
            <div class="form-group-app"><label class="form-label-app">Current password</label><input type="password" class="form-control-app" autocomplete="current-password"></div>
            <div class="form-group-app"><label class="form-label-app">New password</label><input type="password" class="form-control-app" autocomplete="new-password"></div>
            <button type="button" class="btn-app btn-outline-app" id="btnChangePassword">Change password</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/canteen-manager.js"></script>
  <script>$(function () { CanteenManager.initSettings(); });</script>
</body>
</html>
