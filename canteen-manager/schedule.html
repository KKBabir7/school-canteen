<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule | Canteen Manager | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1 data-i18n="schedule">Schedule</h1>
        <p data-i18n="scheduleDesc">School days, breaks, and ordering windows.</p>
      </div>
      <a href="settings.html" class="btn-app btn-outline-app" data-i18n="settings">Settings</a>
    </div>
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card-app mb-4">
          <div class="card-app-header"><h3 id="schedCanteen">Canteen</h3></div>
          <div class="card-app-body">
            <ul class="info-list">
              <li><span class="label" data-i18n="weekdays">School days</span><span class="value" id="schedSchoolDays">—</span></li>
              <li><span class="label">Last order time</span><span class="value" id="schedLastOrder">—</span></li>
              <li><span class="label">Stop window</span><span class="value" id="schedWindow">—</span></li>
              <li><span class="label">Same-day ordering</span><span class="value" id="schedSameDay">—</span></li>
            </ul>
          </div>
        </div>
        <div class="card-app">
          <div class="card-app-header"><h3 data-i18n="myMenus">Menus</h3></div>
          <div class="card-app-body" id="schedMenus"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card-app">
          <div class="card-app-header"><h3 data-i18n="breaks">Breaks</h3></div>
          <div class="card-app-body" id="schedBreaks"></div>
        </div>
      </div>
    </div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function(){ SoonFeatures.initSchedule(); });</script>
</body>
</html>
