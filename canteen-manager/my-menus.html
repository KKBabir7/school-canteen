<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Menus | Canteen Manager | SchoolFood</title>
  <meta name="description" content="View menus assigned to your canteen and manage item availability.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current">My Menus</span></li>
          </ol>
        </nav>

        <div id="menusListView">
          <div class="page-header">
            <div class="page-header-text">
              <h1>My Menus</h1>
              <p>Menus assigned to your canteen by the food provider.</p>
            </div>
          </div>

          <h2 class="h5 mb-3" data-aos="fade-up">Today's menus</h2>
          <div class="menu-grid mb-5" id="todayMenus"></div>

          <h2 class="h5 mb-3" data-aos="fade-up">Upcoming menus</h2>
          <div class="menu-grid" id="upcomingMenus"></div>
        </div>

        <div id="menuDetailView" style="display:none">
          <div class="page-header">
            <div class="page-header-text">
              <button type="button" class="btn-app btn-ghost-app btn-sm-app mb-2" id="btnBackToMenus">
                <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to menus
              </button>
              <h1 id="cmMenuName">Menu</h1>
              <p id="cmMenuDesc" class="mb-2"></p>
              <div id="cmMenuStatus"></div>
            </div>
          </div>
          <p class="text-muted small mb-3">Toggle item availability. Turning an item off opens a confirmation panel with reason and duration.</p>
          <div id="cmMenuSections"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/canteen-manager.js"></script>
  <script>
    $(function () {
      CanteenManager.initMyMenus();
      $('#btnBackToMenus').on('click', function () {
        window.location.href = 'my-menus.html';
      });
    });
  </script>
</body>
</html>
