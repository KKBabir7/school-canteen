<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Menus | Canteen Manager | SchoolFood</title>
  <meta name="description" content="View menus assigned to your canteen and manage item availability.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            <li class="separator">/</li>
            <li><span class="current" data-i18n="myMenus">My Menus</span></li>
          </ol>
        </nav>

        <div id="menusListView">
          <div class="page-header">
            <div class="page-header-text">
              <h1 data-i18n="myMenus">My Menus</h1>
              <p data-i18n="myMenusDesc">Menus assigned to your canteen by the food provider.</p>
            </div>
          </div>

          <h2 class="h5 mb-3" data-aos="fade-up" data-i18n="today">Today's menus</h2>
          <div class="menu-grid mb-5" id="todayMenus"></div>

          <h2 class="h5 mb-3" data-aos="fade-up" data-i18n="upcoming">Upcoming menus</h2>
          <div class="menu-grid" id="upcomingMenus"></div>
        </div>

        <div id="menuDetailView" style="display:none">
          <div class="page-header">
            <div class="page-header-text">
              <button type="button" class="btn-app btn-ghost-app btn-sm-app mb-2" id="btnBackToMenus">
                <i class="bi bi-arrow-left"></i> <span data-i18n="myMenus">Back</span>
              </button>
              <h1 id="cmMenuName">Menu</h1>
              <p id="cmMenuDesc" class="mb-2"></p>
              <div id="cmMenuStatus"></div>
            </div>
          </div>
          <div id="cmMenuSections"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="availabilityModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="changeAvailability">Change Availability Dates</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" data-i18n="weekdays">Weekdays</label>
            <div id="weekdayChecks" class="d-flex flex-wrap gap-2"></div>
          </div>
          <div class="row g-2">
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="availFrom" data-i18n="from">From</label>
              <input type="text" id="availFrom" class="form-control-app">
            </div>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="availTo" data-i18n="to">To</label>
              <input type="text" id="availTo" class="form-control-app">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnSaveAvailability" data-i18n="save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/canteen-manager.js"></script>
  <script>
    $(function () {
      CanteenManager.initMyMenu();
      $('#btnBackToMenus').on('click', () => { window.location.href = 'my-menu.html'; });
    });
  </script>
</body>
</html>
