<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Canteen Manager | SchoolFood</title>
  <meta name="description" content="Manage school canteen orders — New, Preparing, Ready, Upcoming, and History.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current">Orders</span></li>
          </ol>
        </nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1>Orders</h1>
            <p>Process student orders through preparation and pickup.</p>
          </div>
        </div>

        <div class="tabs-app order-tabs" role="tablist" data-aos="fade-up">
          <button type="button" class="tab-btn active" data-tab="new" role="tab" aria-selected="true">
            New <span class="tab-count" id="count-new">0</span>
          </button>
          <button type="button" class="tab-btn" data-tab="preparing" role="tab" aria-selected="false">
            Preparing <span class="tab-count" id="count-preparing">0</span>
          </button>
          <button type="button" class="tab-btn" data-tab="ready" role="tab" aria-selected="false">
            Ready <span class="tab-count" id="count-ready">0</span>
          </button>
          <button type="button" class="tab-btn" data-tab="upcoming" role="tab" aria-selected="false">
            Upcoming <span class="tab-count" id="count-upcoming">0</span>
          </button>
          <button type="button" class="tab-btn" data-tab="history" role="tab" aria-selected="false">
            History <span class="tab-count" id="count-history">0</span>
          </button>
        </div>

        <div class="filters-bar" data-aos="fade-up">
          <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="searchOrders" placeholder="Search student or order number..." aria-label="Search orders">
          </div>
          <div class="filter-select">
            <label class="visually-hidden" for="sortOrders">Sort</label>
            <select id="sortOrders">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
        </div>

        <div id="ordersList"></div>
        <div id="ordersEmpty" style="display:none"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script>$(function () { Orders.initOrdersPage(); });</script>
</body>
</html>
