<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteens | Food Provider | SchoolFood</title>
  <meta name="description" content="Manage school canteens, contact details, and menu assignments from one modern dashboard.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current">Canteens</span></li>
          </ol>
        </nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1>Canteens</h1>
            <p>Manage all physical food locations operated by your organization.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-primary-app" data-bs-toggle="modal" data-bs-target="#addCanteenModal">
              <i class="bi bi-plus-lg" aria-hidden="true"></i> Add Canteen
            </button>
          </div>
        </div>

        <div class="filters-bar" data-aos="fade-up">
          <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="searchCanteens" placeholder="Search canteens..." aria-label="Search canteens">
          </div>
          <div class="filter-select">
            <label class="visually-hidden" for="filterSchool">School</label>
            <select id="filterSchool" class="form-select-app" data-placeholder="All schools" data-allow-clear="true">
              <option value=""></option>
            </select>
          </div>
          <div class="filter-select">
            <label class="visually-hidden" for="filterStatus">Status</label>
            <select id="filterStatus" class="form-select-app" data-placeholder="All statuses" data-allow-clear="true">
              <option value=""></option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="canteen-grid" id="canteensGrid"></div>
        <div id="canteensEmpty" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- Add Canteen Modal -->
  <div class="modal fade modal-app" id="addCanteenModal" tabindex="-1" aria-labelledby="addCanteenLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="addCanteenLabel">Add Canteen</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addCanteenForm" novalidate>
            <div class="form-section">
              <h3 class="form-section-title">Basic Information</h3>
              <div class="form-group-app">
                <label class="form-label-app" for="canteenName">Canteen Name <span class="required">*</span></label>
                <input type="text" id="canteenName" class="form-control-app" required placeholder="e.g. Rosary Main Canteen">
              </div>
              <div class="form-group-app">
                <label class="form-label-app" for="canteenSchool">School <span class="required">*</span></label>
                <select id="canteenSchool" class="select2-field" required data-placeholder="Select school"></select>
              </div>
            </div>
            <div class="form-section">
              <h3 class="form-section-title">Contact Information</h3>
              <div class="row g-3">
                <div class="col-md-6 form-group-app">
                  <label class="form-label-app" for="canteenPhone">Phone</label>
                  <input type="tel" id="canteenPhone" class="form-control-app" placeholder="+972-2-555-0100">
                </div>
                <div class="col-md-6 form-group-app">
                  <label class="form-label-app" for="canteenEmail">Email</label>
                  <input type="email" id="canteenEmail" class="form-control-app" placeholder="canteen@school.edu">
                </div>
              </div>
            </div>
            <div class="form-section mb-0">
              <h3 class="form-section-title">Status</h3>
              <label class="toggle-app">
                <input type="checkbox" id="canteenActive" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-label">Active</span>
              </label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnSaveCanteen">Add Canteen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Assign Menu Modal -->
  <div class="modal fade modal-app" id="assignMenuModal" tabindex="-1" aria-labelledby="assignMenuModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="assignMenuModalLabel">Assign Menu</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="assignMenuSelect">Select Menu <span class="required">*</span></label>
            <select id="assignMenuSelect" class="select2-field" data-placeholder="Choose a menu"></select>
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="assignCanteensSelect">Select Canteens <span class="required">*</span></label>
            <select id="assignCanteensSelect" class="select2-field" multiple data-placeholder="Choose canteens"></select>
          </div>
          <div class="form-group-app">
            <label class="toggle-app">
              <input type="checkbox" id="assignDateRange">
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-label">Available only during specific dates</span>
            </label>
          </div>
          <div id="assignDateFields" class="row g-2" style="display:none">
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignFrom">From</label>
              <input type="date" id="assignFrom" class="form-control-app">
            </div>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignTo">To</label>
              <input type="date" id="assignTo" class="form-control-app">
            </div>
          </div>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="assignStatus">Status</label>
            <select id="assignStatus" class="form-select-app">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnConfirmAssign">Assign Menu</button>
        </div>
      </div>
    </div>
  </div>

  <div class="mobile-bottom-bar">
    <button type="button" class="btn-app btn-primary-app" data-bs-toggle="modal" data-bs-target="#addCanteenModal">
      <i class="bi bi-plus-lg" aria-hidden="true"></i> Add Canteen
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/food-provider.js"></script>
  <script>$(function () { FoodProvider.initCanteensPage(); });</script>
</body>
</html>
