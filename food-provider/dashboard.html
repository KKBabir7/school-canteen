<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Food Provider | SchoolFood</title>
  <meta name="description" content="Food Provider dashboard — manage canteens, menus, and assignments from one place.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><span class="current">Dashboard</span></li>
          </ol>
        </nav>

        <div class="welcome-banner" data-aos="fade-up">
          <h2 id="welcomeTitle">Good morning</h2>
          <p>Manage your canteens and menus from one place.</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card" data-aos="fade-up">
            <div class="stat-card-label">Total Canteens <span class="stat-card-icon"><i class="bi bi-shop" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statTotalCanteens">0</div>
          </div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="50">
            <div class="stat-card-label">Active Canteens <span class="stat-card-icon success"><i class="bi bi-check-circle" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statActiveCanteens">0</div>
          </div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="100">
            <div class="stat-card-label">Active Menus <span class="stat-card-icon info"><i class="bi bi-journal-richtext" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statActiveMenus">0</div>
          </div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="150">
            <div class="stat-card-label">Menus Assigned <span class="stat-card-icon warning"><i class="bi bi-link-45deg" aria-hidden="true"></i></span></div>
            <div class="stat-card-value" id="statMenusAssigned">0</div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card-app mb-4" data-aos="fade-up">
              <div class="card-app-header">
                <h3>Canteen overview</h3>
                <a href="canteens.html" class="btn-app btn-outline-app btn-sm-app">View all</a>
              </div>
              <div class="card-app-body">
                <div class="canteen-grid" id="dashboardCanteens"></div>
              </div>
            </div>

            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header">
                <h3>Recent activity</h3>
              </div>
              <div class="card-app-body">
                <ul class="activity-list" id="activityList"></ul>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header">
                <h3>Quick actions</h3>
              </div>
              <div class="card-app-body">
                <div class="quick-actions">
                  <a href="canteens.html" class="quick-action-btn" id="qaAddCanteen">
                    <i class="bi bi-plus-circle" aria-hidden="true"></i>
                    <span>Add Canteen</span>
                  </a>
                  <a href="create-menu.html" class="quick-action-btn">
                    <i class="bi bi-journal-plus" aria-hidden="true"></i>
                    <span>Create Menu</span>
                  </a>
                  <button type="button" class="quick-action-btn" id="qaAssignMenu">
                    <i class="bi bi-link-45deg" aria-hidden="true"></i>
                    <span>Assign Menu</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Assign Menu Modal -->
  <div class="modal fade modal-app" id="assignMenuModal" tabindex="-1" aria-labelledby="assignMenuModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="assignMenuModalLabel">Assign Menu</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="assignMenuSelect">Select Menu <span class="required">*</span></label>
            <select id="assignMenuSelect" class="select2-field" data-placeholder="Choose a menu"></select>
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="assignCanteensSelect">Select Canteens <span class="required">*</span></label>
            <select id="assignCanteensSelect" class="select2-field" multiple data-placeholder="Choose canteens"></select>
          </div>
          <div class="form-group-app">
            <label class="toggle-app">
              <input type="checkbox" id="assignDateRange">
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-label">Available only during specific dates</span>
            </label>
          </div>
          <div id="assignDateFields" class="row g-2" style="display:none">
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignFrom">From</label>
              <input type="date" id="assignFrom" class="form-control-app">
            </div>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignTo">To</label>
              <input type="date" id="assignTo" class="form-control-app">
            </div>
          </div>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="assignStatus">Status</label>
            <select id="assignStatus" class="form-select-app">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnConfirmAssign">Assign Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/food-provider.js"></script>
  <script>
    $(function () {
      FoodProvider.initDashboard();
      $('#qaAssignMenu').on('click', function () { FoodProvider.openAssignModal(); });
      $('#qaAddCanteen').on('click', function (e) {
        // navigate then user can open modal — or go to canteens with hash
      });
    });
  </script>
</body>
</html>
