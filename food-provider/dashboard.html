<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Food Provider | SchoolFood</title>
  <meta name="description" content="Food Provider dashboard — manage canteens, menus, and assignments.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb-app"><li><span class="current" data-i18n="dashboard">Dashboard</span></li></ol></nav>

        <div class="welcome-banner" data-aos="fade-up">
          <h2 id="welcomeTitle">Good morning</h2>
          <p data-i18n="welcomeFp">Manage your canteens and menus from one place.</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card stat-card--navy" data-aos="fade-up">
            <div class="stat-card-label">
              <span data-i18n="totalCanteens">Total Canteens</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-shop-window"></i></span>
            </div>
            <div class="stat-card-value" id="statTotalCanteens">0</div>
          </div>
          <div class="stat-card stat-card--teal" data-aos="fade-up">
            <div class="stat-card-label">
              <span data-i18n="activeCanteens">Active Canteens</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-check2-circle"></i></span>
            </div>
            <div class="stat-card-value" id="statActiveCanteens">0</div>
          </div>
          <div class="stat-card stat-card--sky" data-aos="fade-up">
            <div class="stat-card-label">
              <span data-i18n="activeMenus">Active Menus</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-journal-text"></i></span>
            </div>
            <div class="stat-card-value" id="statActiveMenus">0</div>
          </div>
          <div class="stat-card stat-card--coral" data-aos="fade-up">
            <div class="stat-card-label">
              <span data-i18n="draftMenus">Draft Menus</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-pencil-square"></i></span>
            </div>
            <div class="stat-card-value" id="statDraftMenus">0</div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card-app mb-4" data-aos="fade-up">
              <div class="card-app-header">
                <h3 data-i18n="recentCanteens">Recent Canteens</h3>
                <a href="canteens.html" class="btn-app btn-outline-app btn-sm-app">View all</a>
              </div>
              <div class="card-app-body"><div class="canteen-grid" id="dashboardCanteens"></div></div>
            </div>
            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header">
                <h3 data-i18n="recentMenus">Recent Menus</h3>
                <a href="menus.html" class="btn-app btn-outline-app btn-sm-app">View all</a>
              </div>
              <div class="card-app-body"><div class="menu-grid" id="recentMenusGrid"></div></div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header"><h3 data-i18n="quickActions">Quick actions</h3></div>
              <div class="card-app-body">
                <div class="quick-actions">
                  <a href="canteens.html" class="quick-action-btn"><i class="bi bi-plus-circle"></i><span data-i18n="addCanteen">Add Canteen</span></a>
                  <a href="menu-editor.html" class="quick-action-btn"><i class="bi bi-journal-plus"></i><span data-i18n="createMenu">Create Menu</span></a>
                  <button type="button" class="quick-action-btn" id="qaAssignMenu"><i class="bi bi-link-45deg"></i><span data-i18n="assignMenu">Assign Menu</span></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="assignMenuModal" tabindex="-1" aria-labelledby="assignMenuModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <span class="modal-title-icon" aria-hidden="true"><i class="bi bi-link-45deg"></i></span>
            <div>
              <h2 class="modal-title" id="assignMenuModalLabel" data-i18n="assignMenu">Assign Menu</h2>
              <p class="modal-subtitle">Link a menu to one or more canteens</p>
            </div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="assignMenuSelect">Select Menu <span class="required">*</span></label>
            <select id="assignMenuSelect" class="select2-field" data-placeholder="Choose a menu" data-allow-clear="true"></select>
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="assignCanteensSelect" data-i18n="selectCanteens">Select Canteens <span class="required">*</span></label>
            <select id="assignCanteensSelect" class="select2-field" multiple data-placeholder="Choose canteens"></select>
          </div>
          <div class="form-group-app">
            <label class="toggle-app">
              <input type="checkbox" id="assignDateRange">
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-label" data-i18n="specificDates">Available only during specific dates</span>
            </label>
          </div>
          <div id="assignDateFields" class="row g-2 assign-date-fields" hidden>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignFrom">From</label>
              <input type="text" id="assignFrom" class="form-control-app" placeholder="Select date" autocomplete="off">
            </div>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignTo">To</label>
              <input type="text" id="assignTo" class="form-control-app" placeholder="Select date" autocomplete="off">
            </div>
          </div>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="assignStatus">Status</label>
            <select id="assignStatus" class="select2-field" data-placeholder="Select status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnConfirmAssign">
            <i class="bi bi-check2-circle" aria-hidden="true"></i> <span data-i18n="assign">Assign</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/food-provider.js"></script>
  <script>$(function () { FoodProvider.initDashboard(); $('#qaAssignMenu').on('click', () => FoodProvider.openAssignModal()); });</script>
</body>
</html>
