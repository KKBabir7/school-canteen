<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Food Provider | SchoolFood</title>
  <meta name="description" content="Food Provider account settings — change password (demo).">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            <li class="separator">/</li>
            <li><span class="current" data-i18n="settings">Settings</span></li>
          </ol>
        </nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1 data-i18n="settings">Settings</h1>
            <p data-i18n="account">Account preferences for your food provider organization.</p>
          </div>
        </div>

        <div class="settings-card" style="max-width:560px" data-aos="fade-up">
          <h3 data-i18n="account">Account</h3>
          <div class="form-group-app">
            <label class="form-label-app" for="fpAccountName" data-i18n="name">Name</label>
            <input type="text" id="fpAccountName" class="form-control-app">
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="fpAccountEmail" data-i18n="email">Email</label>
            <input type="email" id="fpAccountEmail" class="form-control-app">
          </div>
          <hr>
          <h4 class="h6">Change password</h4>
          <div class="form-group-app">
            <label class="form-label-app" for="fpCurrentPassword">Current password</label>
            <input type="password" id="fpCurrentPassword" class="form-control-app" autocomplete="current-password">
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="fpNewPassword">New password</label>
            <input type="password" id="fpNewPassword" class="form-control-app" autocomplete="new-password">
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn-app btn-outline-app" id="btnChangePassword">Change password</button>
            <button type="button" class="btn-app btn-primary-app" id="btnSaveAccount" data-i18n="saveChanges">Save changes</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/food-provider.js"></script>
  <script>$(function () { FoodProvider.initSettingsPage(); });</script>
</body>
</html>
