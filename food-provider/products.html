<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Food Provider | SchoolFood</title>
  <meta name="description" content="Product catalog for school canteen menus.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1 data-i18n="products">Products</h1>
        <p data-i18n="productsDesc">Catalog of items you can add to menus.</p>
      </div>
      <button type="button" class="btn-app btn-primary-app" id="btnAddProduct"><i class="bi bi-plus-lg"></i> <span data-i18n="createProduct">Create Product</span></button>
    </div>
    <div class="filters-bar">
      <div class="search-box"><i class="bi bi-search"></i><input type="search" id="searchProducts" data-i18n-placeholder="search" placeholder="Search"></div>
      <select id="filterProductType" class="form-select-app" style="max-width:200px">
        <option value="" data-i18n="all">All</option>
        <option value="provider" data-i18n="providerProduct">Provider</option>
        <option value="common" data-i18n="commonProduct">Common</option>
      </select>
    </div>
    <div class="food-grid" id="productsGrid"></div>
    <div id="productsEmpty" style="display:none"></div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function(){ SoonFeatures.initProducts(); });</script>
</body>
</html>
