<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Food Provider | SchoolFood</title>
  <meta name="description" content="Product catalog for school canteen menus.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="products">Products</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-box-seam" aria-hidden="true"></i> Catalog</p>
            <h1 data-i18n="products">Products</h1>
            <p data-i18n="productsDesc">Catalog of items you can add to menus.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-primary-app" id="btnAddProduct">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              <span data-i18n="createProduct">Create Product</span>
            </button>
          </div>
        </div>

        <div class="filters-bar" data-aos="fade-up">
          <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="searchProducts" data-i18n-placeholder="search" placeholder="Search products">
          </div>
          <div class="filter-select">
            <select id="filterProductType" class="select2-field" data-placeholder="Product type">
              <option value="">All types</option>
              <option value="provider" data-i18n="providerProduct">Provider</option>
              <option value="common" data-i18n="commonProduct">Common</option>
            </select>
          </div>
        </div>

        <div class="food-grid" id="productsGrid"></div>
        <div id="productsEmpty" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <span class="modal-title-icon" aria-hidden="true"><i class="bi bi-box-seam"></i></span>
            <div>
              <h2 class="modal-title" id="productModalLabel" data-i18n="createProduct">Create Product</h2>
              <p class="modal-subtitle" id="productModalSubtitle">Add a bilingual item to your catalog</p>
            </div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="productEditId" value="">
          <div class="row g-3">
            <div class="col-md-6 form-group-app">
              <label class="form-label-app" for="pNameEn" data-i18n="productNameEn">Product Name — English <span class="required">*</span></label>
              <input type="text" id="pNameEn" class="form-control-app" required autocomplete="off">
            </div>
            <div class="col-md-6 form-group-app">
              <label class="form-label-app" for="pNameAr" data-i18n="productNameAr">Product Name — Arabic <span class="required">*</span></label>
              <input type="text" id="pNameAr" class="form-control-app" required dir="rtl" autocomplete="off">
            </div>
            <div class="col-md-6 form-group-app">
              <label class="form-label-app" for="pDescEn" data-i18n="descEn">Description — English</label>
              <textarea id="pDescEn" class="form-control-app" rows="3"></textarea>
            </div>
            <div class="col-md-6 form-group-app">
              <label class="form-label-app" for="pDescAr" data-i18n="descAr">Description — Arabic</label>
              <textarea id="pDescAr" class="form-control-app" rows="3" dir="rtl"></textarea>
            </div>
            <div class="col-md-4 form-group-app">
              <label class="form-label-app" for="pPrice" data-i18n="price">Price <span class="required">*</span></label>
              <input type="number" id="pPrice" class="form-control-app" min="0" step="1" required>
            </div>
            <div class="col-md-4 form-group-app">
              <label class="form-label-app" for="pType">Product type</label>
              <select id="pType" class="select2-field" data-placeholder="Select type">
                <option value="provider" data-i18n="providerProduct">Provider product</option>
                <option value="common" data-i18n="commonProduct">Common product</option>
              </select>
            </div>
            <div class="col-md-4 form-group-app d-flex align-items-end">
              <label class="toggle-app mb-1">
                <input type="checkbox" id="pAvail" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-label" data-i18n="available">Available</span>
              </label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnSaveProduct">
            <i class="bi bi-check2-circle" aria-hidden="true"></i>
            <span data-i18n="save">Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function () { SoonFeatures.initProducts(); });</script>
</body>
</html>
