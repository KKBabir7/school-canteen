<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Editor | Food Provider | SchoolFood</title>
  <meta name="description" content="Build bilingual school canteen menus with sections and products.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><a href="menus.html" data-i18n="menus">Menus</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" id="pageMenuTitle" data-i18n="createMenu">Create Menu</span></li>
          </ol>
        </nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1 data-i18n="createMenu">Create Menu</h1>
            <p data-i18n="menusDesc">Create and manage menus available across your canteens.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-outline-app" id="btnSaveMenu" data-i18n="draft">Save as Draft</button>
            <button type="button" class="btn-app btn-primary-app" id="btnPublishMenu" data-i18n="activate">Save &amp; Activate</button>
          </div>
        </div>

        <div class="menu-builder-layout">
          <div>
            <div class="card-app mb-4" data-aos="fade-up">
              <div class="card-app-header"><h3 data-i18n="menus">Menu Information</h3></div>
              <div class="card-app-body">
                <div class="row g-3">
                  <div class="col-md-6 form-group-app">
                    <label class="form-label-app" for="menuNameEn" data-i18n="menuNameEn">Menu Name — English</label>
                    <input type="text" id="menuNameEn" class="form-control-app" required>
                  </div>
                  <div class="col-md-6 form-group-app">
                    <label class="form-label-app" for="menuNameAr" data-i18n="menuNameAr">Menu Name — Arabic</label>
                    <input type="text" id="menuNameAr" class="form-control-app" required dir="rtl">
                  </div>
                  <div class="col-md-6 form-group-app">
                    <label class="form-label-app" for="menuDescEn" data-i18n="descEn">Description — English</label>
                    <textarea id="menuDescEn" class="form-control-app" rows="2"></textarea>
                  </div>
                  <div class="col-md-6 form-group-app">
                    <label class="form-label-app" for="menuDescAr" data-i18n="descAr">Description — Arabic</label>
                    <textarea id="menuDescAr" class="form-control-app" rows="2" dir="rtl"></textarea>
                  </div>
                  <div class="col-12 form-group-app mb-0">
                    <label class="form-label-app" for="menuStatus" data-i18n="status">Status</label>
                    <select id="menuStatus" class="form-select-app">
                      <option value="draft" data-i18n="draft">Draft</option>
                      <option value="active" data-i18n="active">Active</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3" data-aos="fade-up">
              <h2 class="h5 mb-0" data-i18n="sections">Menu Sections</h2>
              <button type="button" class="btn-app btn-outline-app btn-sm-app" id="btnAddSection">
                <i class="bi bi-plus-lg"></i> <span data-i18n="addSection">Add Section</span>
              </button>
            </div>
            <div id="menuSectionsBuilder"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="addSectionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="addSection">Add Section</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="sectionNameEn" data-i18n="sectionNameEn">Section Name — English</label>
            <input type="text" id="sectionNameEn" class="form-control-app" required>
          </div>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="sectionNameAr" data-i18n="sectionNameAr">Section Name — Arabic</label>
            <input type="text" id="sectionNameAr" class="form-control-app" required dir="rtl">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnConfirmSection" data-i18n="save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="addItemModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="addItem">Add Item</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="itemProductSelect" data-i18n="searchProducts">Search Products</label>
            <select id="itemProductSelect" class="select2-field"></select>
          </div>
          <button type="button" class="btn-app btn-outline-app btn-sm-app mb-3" id="btnShowCreateProduct">
            <i class="bi bi-plus-lg"></i> <span data-i18n="createProduct">Create New Product</span>
          </button>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="itemMenuPrice" data-i18n="menuPrice">Menu Price</label>
            <input type="number" id="itemMenuPrice" class="form-control-app" min="0" step="1">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnConfirmItem" data-i18n="addItem">Add Item</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="newProductModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="createProduct">Create New Product</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="productNameEn" data-i18n="productNameEn">Product Name — English</label>
            <input type="text" id="productNameEn" class="form-control-app" required>
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="productNameAr" data-i18n="productNameAr">Product Name — Arabic</label>
            <input type="text" id="productNameAr" class="form-control-app" required dir="rtl">
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="productDescEn" data-i18n="descEn">Description — English</label>
            <textarea id="productDescEn" class="form-control-app" rows="2"></textarea>
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="productDescAr" data-i18n="descAr">Description — Arabic</label>
            <textarea id="productDescAr" class="form-control-app" rows="2" dir="rtl"></textarea>
          </div>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="productPrice" data-i18n="price">Price</label>
            <input type="number" id="productPrice" class="form-control-app" min="0" step="1">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnSaveProduct" data-i18n="save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/menu.js"></script>
  <script>$(function () { MenuBuilder.init(); });</script>
</body>
</html>
