<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Food Provider | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb-app">
        <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
        <li class="separator" aria-hidden="true">/</li>
        <li><span class="current" data-i18n="calendar">Calendar</span></li>
      </ol>
    </nav>

    <div class="page-header page-header--panel">
      <div class="page-header-text">
        <p class="page-kicker"><i class="bi bi-calendar3" aria-hidden="true"></i> Planning</p>
        <h1 data-i18n="calendar">Calendar</h1>
        <p data-i18n="calendarDesc">Menus by weekday and order activity.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card-app" data-aos="fade-up">
          <div class="card-app-header">
            <h3><i class="bi bi-calendar-week" aria-hidden="true"></i> <span id="calendarMonthTitle">Month view</span></h3>
          </div>
          <div class="card-app-body">
            <div class="calendar-grid calendar-weekday-row" aria-hidden="true">
              <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="calendar-grid" id="featureCalendarGrid"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-app" data-aos="fade-up">
          <div class="card-app-header"><h3><i class="bi bi-journal-check" aria-hidden="true"></i> <span data-i18n="activeMenus">Active Menus</span></h3></div>
          <div class="card-app-body">
            <div class="calendar-menu-list" id="calendarMenuLegend"></div>
          </div>
        </div>
      </div>
    </div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function(){ SoonFeatures.initCalendar('provider'); });</script>
</body>
</html>
