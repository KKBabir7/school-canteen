<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Details | Food Provider | SchoolFood</title>
  <meta name="description" content="View canteen details, assigned menus, and basic settings.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content" id="canteenDetailRoot">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><a href="canteens.html">Canteens</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current">Details</span></li>
          </ol>
        </nav>

        <div class="detail-header" data-aos="fade-up">
          <div>
            <h1 id="detailName">Canteen</h1>
            <div class="detail-meta">
              <span><i class="bi bi-building" aria-hidden="true"></i> <span id="detailSchool">—</span></span>
              <span id="detailStatus"></span>
            </div>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-primary-app" id="btnAssignFromDetail">
              <i class="bi bi-link-45deg" aria-hidden="true"></i> Assign Menu
            </button>
          </div>
        </div>

        <div class="tabs-app" role="tablist" data-aos="fade-up">
          <button type="button" class="tab-btn active" data-tab="overview" role="tab" aria-selected="true">Overview</button>
          <button type="button" class="tab-btn" data-tab="menus" role="tab" aria-selected="false">Menus</button>
          <button type="button" class="tab-btn" data-tab="settings" role="tab" aria-selected="false">Settings</button>
        </div>

        <div class="tab-panel active" id="panel-overview" role="tabpanel">
          <div class="row g-4">
            <div class="col-lg-6">
              <div class="card-app">
                <div class="card-app-header"><h3>Canteen information</h3></div>
                <div class="card-app-body">
                  <ul class="info-list">
                    <li><span class="label">Name</span><span class="value" id="infoName">—</span></li>
                    <li><span class="label">School</span><span class="value" id="infoSchool">—</span></li>
                    <li><span class="label">Phone</span><span class="value" id="infoPhone">—</span></li>
                    <li><span class="label">Email</span><span class="value" id="infoEmail">—</span></li>
                    <li><span class="label">Status</span><span class="value" id="infoStatus">—</span></li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card-app mb-4">
                <div class="card-app-header"><h3>Assigned menus</h3></div>
                <div class="card-app-body" id="overviewMenus"></div>
              </div>
              <div class="card-app">
                <div class="card-app-header"><h3>Quick actions</h3></div>
                <div class="card-app-body">
                  <div class="quick-actions">
                    <button type="button" class="quick-action-btn" onclick="document.getElementById('btnAssignFromDetail').click()">
                      <i class="bi bi-link-45deg" aria-hidden="true"></i> Assign Menu
                    </button>
                    <button type="button" class="quick-action-btn" onclick="Components.setActiveTab('settings')">
                      <i class="bi bi-gear" aria-hidden="true"></i> Edit Settings
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-menus" role="tabpanel">
          <div id="assignedMenusList"></div>
        </div>

        <div class="tab-panel" id="panel-settings" role="tabpanel">
          <div class="settings-card" style="max-width:560px">
            <h3>Basic settings</h3>
            <p class="settings-desc">Update canteen contact details and status.</p>
            <div class="form-group-app">
              <label class="form-label-app" for="settingsName">Canteen name</label>
              <input type="text" id="settingsName" class="form-control-app">
            </div>
            <div class="form-group-app">
              <label class="form-label-app" for="settingsPhone">Phone</label>
              <input type="tel" id="settingsPhone" class="form-control-app">
            </div>
            <div class="form-group-app">
              <label class="form-label-app" for="settingsEmail">Email</label>
              <input type="email" id="settingsEmail" class="form-control-app">
            </div>
            <div class="form-group-app">
              <label class="toggle-app">
                <input type="checkbox" id="settingsActive">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-label">Active</span>
              </label>
            </div>
            <button type="button" class="btn-app btn-primary-app" id="btnSaveCanteenSettings">Save changes</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="assignMenuModal" tabindex="-1" aria-labelledby="assignMenuModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="assignMenuModalLabel">Assign Menu</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-group-app">
            <label class="form-label-app" for="assignMenuSelect">Select Menu <span class="required">*</span></label>
            <select id="assignMenuSelect" class="select2-field" data-placeholder="Choose a menu"></select>
          </div>
          <div class="form-group-app">
            <label class="form-label-app" for="assignCanteensSelect">Select Canteens <span class="required">*</span></label>
            <select id="assignCanteensSelect" class="select2-field" multiple data-placeholder="Choose canteens"></select>
          </div>
          <div class="form-group-app">
            <label class="toggle-app">
              <input type="checkbox" id="assignDateRange">
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-label">Available only during specific dates</span>
            </label>
          </div>
          <div id="assignDateFields" class="row g-2" style="display:none">
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignFrom">From</label>
              <input type="date" id="assignFrom" class="form-control-app">
            </div>
            <div class="col-6 form-group-app">
              <label class="form-label-app" for="assignTo">To</label>
              <input type="date" id="assignTo" class="form-control-app">
            </div>
          </div>
          <div class="form-group-app mb-0">
            <label class="form-label-app" for="assignStatus">Status</label>
            <select id="assignStatus" class="form-select-app">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-app btn-primary-app" id="btnConfirmAssign">Assign Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/food-provider.js"></script>
  <script>$(function () { FoodProvider.initCanteenDetails(); });</script>
</body>
</html>
