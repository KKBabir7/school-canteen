<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menus | Food Provider | SchoolFood</title>
  <meta name="description" content="Create and manage bilingual menus across canteens.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb-app"><li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li><li class="separator">/</li><li><span class="current" data-i18n="menus">Menus</span></li></ol></nav>

        <div class="page-header">
          <div class="page-header-text">
            <h1 data-i18n="menus">Menus</h1>
            <p data-i18n="menusDesc">Create and manage menus available across your canteens.</p>
          </div>
          <div class="page-actions">
            <a href="menu-editor.html" class="btn-app btn-primary-app"><i class="bi bi-plus-lg"></i> <span data-i18n="createMenu">Create Menu</span></a>
          </div>
        </div>

        <div class="filters-bar" data-aos="fade-up">
          <div class="search-box"><i class="bi bi-search"></i><input type="search" id="searchMenus" data-i18n-placeholder="search" placeholder="Search"></div>
          <div class="filter-tabs">
            <button type="button" class="filter-tab active" data-status="" data-i18n="all">All</button>
            <button type="button" class="filter-tab" data-status="active" data-i18n="active">Active</button>
            <button type="button" class="filter-tab" data-status="draft" data-i18n="draft">Draft</button>
            <button type="button" class="filter-tab" data-status="inactive" data-i18n="inactive">Inactive</button>
          </div>
        </div>

        <div class="menu-grid" id="menusGrid"></div>
        <div id="menusEmpty" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="modal fade modal-app" id="assignMenuModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title" data-i18n="assignMenu">Assign Menu</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="form-group-app"><select id="assignMenuSelect" class="select2-field"></select></div>
          <div class="form-group-app"><select id="assignCanteensSelect" class="select2-field" multiple data-i18n="selectCanteens"></select></div>
          <label class="toggle-app"><input type="checkbox" id="assignDateRange"><span class="toggle-track"></span><span data-i18n="specificDates">Specific dates</span></label>
          <div id="assignDateFields" class="row g-2" style="display:none"><div class="col-6"><input id="assignFrom" class="form-control-app"></div><div class="col-6"><input id="assignTo" class="form-control-app"></div></div>
          <select id="assignStatus" class="form-select-app"><option value="active">Active</option><option value="inactive">Inactive</option></select>
        </div>
        <div class="modal-footer"><button type="button" class="btn-app btn-outline-app" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button><button type="button" class="btn-app btn-primary-app" id="btnConfirmAssign" data-i18n="assign">Assign</button></div>
      </div>
    </div>
  </div>

  <div class="mobile-bottom-bar"><a href="menu-editor.html" class="btn-app btn-primary-app"><i class="bi bi-plus-lg"></i> <span data-i18n="createMenu">Create Menu</span></a></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/food-provider.js"></script>
  <script>$(function () { FoodProvider.initMenusPage(); });</script>
</body>
</html>
