<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Food Provider | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1 data-i18n="reports">Reports</h1>
        <p data-i18n="reportsDesc">Operational overview from order activity.</p>
      </div>
    </div>
    <div class="stat-grid mb-4">
      <div class="stat-card"><div class="stat-card-label" data-i18n="orders">Orders</div><div class="stat-card-value" id="repTotalOrders">0</div></div>
      <div class="stat-card"><div class="stat-card-label" data-i18n="revenue">Revenue</div><div class="stat-card-value" id="repRevenue">0</div></div>
      <div class="stat-card"><div class="stat-card-label" data-i18n="completed">Completed</div><div class="stat-card-value" id="repCompleted">0</div></div>
      <div class="stat-card"><div class="stat-card-label" data-i18n="active">In progress</div><div class="stat-card-value" id="repActive">0</div></div>
    </div>
    <div class="row g-4">
      <div class="col-md-5"><div class="card-app"><div class="card-app-header"><h3 data-i18n="status">Status</h3></div>
        <div class="card-app-body"><canvas id="chartStatus" height="220"></canvas></div></div></div>
      <div class="col-md-7"><div class="card-app"><div class="card-app-header"><h3 data-i18n="orders">Orders by day</h3></div>
        <div class="card-app-body"><canvas id="chartTrend" height="220"></canvas></div></div></div>
    </div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function(){ SoonFeatures.initReports(null); });</script>
</body>
</html>
