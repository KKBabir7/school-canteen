<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Food Provider | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb-app">
        <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
        <li class="separator" aria-hidden="true">/</li>
        <li><span class="current" data-i18n="reports">Reports</span></li>
      </ol>
    </nav>

    <div class="page-header page-header--panel">
      <div class="page-header-text">
        <p class="page-kicker"><i class="bi bi-bar-chart-line" aria-hidden="true"></i> Insights</p>
        <h1 data-i18n="reports">Reports</h1>
        <p data-i18n="reportsDesc">Operational overview from order activity.</p>
      </div>
      <div class="page-actions">
        <div class="filter-select" style="min-width:180px">
          <select id="reportRange" class="select2-field" data-placeholder="Range">
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="all">All time</option>
          </select>
        </div>
      </div>
    </div>

    <div class="stat-grid mb-4">
      <div class="stat-card stat-card--navy" data-aos="fade-up"><div class="stat-card-label"><span data-i18n="orders">Orders</span><span class="stat-card-icon" aria-hidden="true"><i class="bi bi-bag"></i></span></div><div class="stat-card-value" id="repTotalOrders">0</div></div>
      <div class="stat-card stat-card--teal" data-aos="fade-up"><div class="stat-card-label"><span data-i18n="revenue">Revenue</span><span class="stat-card-icon" aria-hidden="true"><i class="bi bi-cash-coin"></i></span></div><div class="stat-card-value" id="repRevenue">0</div></div>
      <div class="stat-card stat-card--sky" data-aos="fade-up"><div class="stat-card-label"><span data-i18n="completed">Completed</span><span class="stat-card-icon" aria-hidden="true"><i class="bi bi-check2-circle"></i></span></div><div class="stat-card-value" id="repCompleted">0</div></div>
      <div class="stat-card stat-card--coral" data-aos="fade-up"><div class="stat-card-label"><span data-i18n="active">In progress</span><span class="stat-card-icon" aria-hidden="true"><i class="bi bi-hourglass-split"></i></span></div><div class="stat-card-value" id="repActive">0</div></div>
    </div>

    <div class="row g-4">
      <div class="col-md-5">
        <div class="card-app" data-aos="fade-up">
          <div class="card-app-header"><h3><i class="bi bi-pie-chart" aria-hidden="true"></i> <span data-i18n="status">Status</span></h3></div>
          <div class="card-app-body"><canvas id="chartStatus" height="220"></canvas></div>
        </div>
      </div>
      <div class="col-md-7">
        <div class="card-app" data-aos="fade-up">
          <div class="card-app-header"><h3><i class="bi bi-graph-up" aria-hidden="true"></i> <span data-i18n="orders">Orders by day</span></h3></div>
          <div class="card-app-body"><canvas id="chartTrend" height="220"></canvas></div>
        </div>
      </div>
    </div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function(){ SoonFeatures.initReports(null); });</script>
</body>
</html>
