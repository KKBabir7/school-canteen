<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Children | Parent | SchoolFood</title>
  <meta name="description" content="Manage children profiles, wallets, and food controls.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="home.html" data-i18n="home">Home</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="myChildren">My Children</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-people" aria-hidden="true"></i> Family</p>
            <h1 data-i18n="myChildren">My Children</h1>
            <p>Profiles, wallets, and food controls for each child.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-primary-app" id="btnAddChild">
              <i class="bi bi-person-plus" aria-hidden="true"></i>
              <span data-i18n="addChild">Add Child</span>
            </button>
          </div>
        </div>

        <div class="stat-grid parent-home-stats mb-4" data-aos="fade-up">
          <div class="stat-card stat-card--navy">
            <div class="stat-card-label">
              <span data-i18n="myChildren">Children</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-people"></i></span>
            </div>
            <div class="stat-card-value" id="childrenCountStat">0</div>
          </div>
          <div class="stat-card stat-card--teal">
            <div class="stat-card-label">
              <span data-i18n="familyWallet">Family Wallet</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-wallet2"></i></span>
            </div>
            <div class="stat-card-value" id="childrenWalletStat">₪0</div>
          </div>
          <div class="stat-card stat-card--sky">
            <div class="stat-card-label">
              <span>In wallets</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-piggy-bank"></i></span>
            </div>
            <div class="stat-card-value" id="childrenPocketStat">₪0</div>
          </div>
          <div class="stat-card stat-card--coral">
            <div class="stat-card-label">
              <span data-i18n="orderFood">Order</span>
              <span class="stat-card-icon" aria-hidden="true"><i class="bi bi-cart3"></i></span>
            </div>
            <div class="stat-card-value stat-card-value--action">
              <a href="order.html" class="btn-app btn-sm-app btn-ghost-light">
                <i class="bi bi-cart3" aria-hidden="true"></i>
                <span data-i18n="orderFood">Order Food</span>
              </a>
            </div>
          </div>
        </div>

        <div class="card-app" data-aos="fade-up">
          <div class="card-app-header">
            <h3><i class="bi bi-people" aria-hidden="true"></i> <span data-i18n="myChildren">My Children</span></h3>
          </div>
          <div class="card-app-body">
            <div class="parent-children-grid parent-children-grid--list" id="childrenList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script>$(function () { ParentApp.initChildren(); });</script>
</body>
</html>
