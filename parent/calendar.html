<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Parent | SchoolFood</title>
  <meta name="description" content="Calendar of ordered meals and open ordering days.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="home.html" data-i18n="home">Home</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="calendar">Calendar</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-calendar3" aria-hidden="true"></i> Schedule</p>
            <h1 data-i18n="calendar">Calendar</h1>
            <p>Tap a day with an order to view it, or an empty day to order food.</p>
          </div>
          <div class="page-actions">
            <a href="order.html" class="btn-app btn-primary-app">
              <i class="bi bi-cart3" aria-hidden="true"></i>
              <span data-i18n="orderFood">Order Food</span>
            </a>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header">
                <h3><i class="bi bi-calendar3" aria-hidden="true"></i> <span data-i18n="calendar">Calendar</span></h3>
              </div>
              <div class="card-app-body">
                <div class="calendar-weekday-row calendar-grid">
                  <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card-app" data-aos="fade-up">
              <div class="card-app-header">
                <h3><i class="bi bi-info-circle" aria-hidden="true"></i> Day details</h3>
              </div>
              <div class="card-app-body" id="calendarDayPanel">
                <p class="text-muted mb-0">Select a day</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script>$(function () { ParentApp.initCalendar(); });</script>
</body>
</html>
