<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Details | Parent | SchoolFood</title>
  <meta name="description" content="Child profile, wallet, food controls, and order history.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="home.html" data-i18n="home">Home</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><a href="children.html" data-i18n="myChildren">My Children</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" id="childCrumb">Child</span></li>
          </ol>
        </nav>

        <div class="detail-header" data-aos="fade-up">
          <div class="detail-header-main">
            <img id="childAvatar" class="child-avatar child-avatar--lg" src="" alt="" width="64" height="64">
            <div>
              <p class="page-kicker mb-1"><i class="bi bi-person-badge" aria-hidden="true"></i> Child profile</p>
              <h1 id="childName">Child</h1>
              <p class="mb-0 text-muted" id="childMeta"></p>
            </div>
          </div>
          <div class="page-actions">
            <a href="children.html" class="btn-app btn-outline-app btn-sm-app">
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
              <span data-i18n="myChildren">My Children</span>
            </a>
            <a href="order.html" class="btn-app btn-primary-app" id="btnOrderForChild">
              <i class="bi bi-cart3" aria-hidden="true"></i>
              <span data-i18n="orderFood">Order Food</span>
            </a>
          </div>
        </div>

        <div class="tabs-app" role="tablist">
          <button type="button" class="tab-btn active" data-tab="profile" data-i18n="profile">Profile</button>
          <button type="button" class="tab-btn" data-tab="wallet" data-i18n="wallet">Wallet &amp; spending</button>
          <button type="button" class="tab-btn" data-tab="food" data-i18n="foodControls">Food Controls</button>
          <button type="button" class="tab-btn" data-tab="history" data-i18n="history">History</button>
        </div>

        <div class="tab-panel active" id="panel-profile">
          <div class="card-app" data-aos="fade-up">
            <div class="card-app-header">
              <h3><i class="bi bi-card-heading" aria-hidden="true"></i> <span data-i18n="profile">Profile</span></h3>
            </div>
            <div class="card-app-body">
              <ul class="info-list mb-0">
                <li><span class="label" data-i18n="school">School</span><span class="value" id="profSchool">—</span></li>
                <li><span class="label" data-i18n="grade">Grade</span><span class="value" id="profGrade">—</span></li>
                <li><span class="label" data-i18n="class">Class</span><span class="value" id="profClass">—</span></li>
                <li><span class="label" data-i18n="studentId">Student ID</span><span class="value" id="profStudentId">—</span></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-wallet">
          <div class="row g-4">
            <div class="col-lg-5">
              <div class="wallet-card child h-100">
                <div class="label" data-i18n="wallet">Wallet</div>
                <div class="balance" id="childWalletBal">₪0</div>
                <div class="wallet-actions">
                  <button type="button" class="btn-app btn-sm-app" id="btnChildTransfer" data-i18n="transfer">Transfer</button>
                  <button type="button" class="btn-app btn-sm-app" id="btnChildDailyLimit" data-i18n="dailyLimit">Daily limit</button>
                  <a href="wallet.html" class="btn-app btn-sm-app" data-i18n="wallet">Family Wallet</a>
                </div>
              </div>
            </div>
            <div class="col-lg-7">
              <div class="card-app h-100">
                <div class="card-app-header">
                  <h3><i class="bi bi-sliders" aria-hidden="true"></i> Ordering permissions</h3>
                </div>
                <div class="card-app-body">
                  <label class="toggle-app mb-3">
                    <input type="checkbox" id="toggleAppOrder">
                    <span class="toggle-track"></span>
                    <span>Allow independent ordering in the app</span>
                  </label>
                  <label class="toggle-app">
                    <input type="checkbox" id="toggleCanteenOrder">
                    <span class="toggle-track"></span>
                    <span>Allow purchases at the canteen</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-food">
          <div class="card-app" data-aos="fade-up">
            <div class="card-app-header">
              <h3><i class="bi bi-shield-check" aria-hidden="true"></i> <span data-i18n="foodControls">Food Controls</span></h3>
              <button type="button" class="btn-app btn-primary-app btn-sm-app" id="btnSaveChildControls" data-i18n="saveChanges">Save</button>
            </div>
            <div class="card-app-body">
              <div class="form-group-app mb-3">
                <label class="form-label-app" for="foodModeSelect">Control mode</label>
                <select id="foodModeSelect" class="select2-field" data-placeholder="Mode">
                  <option value="all" data-i18n="allowAll">Allow all</option>
                  <option value="block" data-i18n="blockSelected">Block selected</option>
                  <option value="allow" data-i18n="allowSelected">Allow only selected</option>
                </select>
              </div>
              <div id="foodControlList" class="check-list mb-0"></div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-history">
          <div class="card-app" data-aos="fade-up">
            <div class="card-app-header">
              <h3><i class="bi bi-receipt" aria-hidden="true"></i> <span data-i18n="history">History</span></h3>
            </div>
            <div class="card-app-body" id="childOrderHistory"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script>
    $(function () {
      ParentApp.initChildDetails();
      const id = new URLSearchParams(location.search).get('id');
      if (id) $('#btnOrderForChild').attr('href', 'order.html?child=' + id);
    });
  </script>
</body>
</html>
