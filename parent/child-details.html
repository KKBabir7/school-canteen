<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Details | Parent | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="detail-header">
      <div class="d-flex gap-3 align-items-center">
        <img id="childAvatar" class="child-avatar" src="" alt="" width="56" height="56" style="border-radius:50%;object-fit:cover">
        <div><h1 id="childName">Child</h1><p class="mb-0 text-muted" id="childMeta"></p></div>
      </div>
      <a href="order.html" class="btn-app btn-primary-app" id="btnOrderForChild" data-i18n="orderFood">Order Food</a>
    </div>
    <div class="tabs-app" role="tablist">
      <button type="button" class="tab-btn active" data-tab="wallet" data-i18n="wallet">Wallet</button>
      <button type="button" class="tab-btn" data-tab="food" data-i18n="foodControls">Food Controls</button>
      <button type="button" class="tab-btn" data-tab="profile" data-i18n="profile">Profile</button>
    </div>
    <div class="tab-panel active" id="panel-wallet">
      <div class="wallet-card child mb-3">
        <div class="label">Wallet</div>
        <div class="balance" id="childWalletBal">₪0</div>
        <div class="wallet-actions">
          <button type="button" class="btn-app btn-sm-app" id="btnChildTransfer" data-i18n="transfer">Transfer</button>
          <a href="wallet.html" class="btn-app btn-sm-app" data-i18n="wallet">Family Wallet</a>
        </div>
      </div>
      <label class="toggle-app mb-2"><input type="checkbox" id="toggleAppOrder"><span class="toggle-track"></span><span>Allow independent ordering in the app</span></label>
      <label class="toggle-app"><input type="checkbox" id="toggleCanteenOrder"><span class="toggle-track"></span><span>Allow purchases at the canteen</span></label>
    </div>
    <div class="tab-panel" id="panel-food">
      <div class="check-list mb-3">
        <label class="check-item"><input type="radio" name="foodMode" value="all" checked> <span data-i18n="allowAll">Allow all</span></label>
        <label class="check-item"><input type="radio" name="foodMode" value="block"> <span data-i18n="blockSelected">Block selected</span></label>
        <label class="check-item"><input type="radio" name="foodMode" value="allow"> <span data-i18n="allowSelected">Allow only selected</span></label>
      </div>
      <div id="foodControlList" class="check-list mb-3"></div>
      <button type="button" class="btn-app btn-primary-app" id="btnSaveChildControls" data-i18n="saveChanges">Save</button>
    </div>
    <div class="tab-panel" id="panel-profile">
      <p class="text-muted">Profile fields are managed from Add/Edit child. Allergens & hobbies come later.</p>
    </div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script>
    $(function(){
      ParentApp.initChildDetails();
      const id = new URLSearchParams(location.search).get('id');
      if (id) $('#btnOrderForChild').attr('href', 'order.html?child=' + id);
    });
  </script>
</body>
</html>
