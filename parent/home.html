<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Parent | SchoolFood</title>
  <meta name="description" content="Parent home — children, family wallet, and quick order actions.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="parent-hero" data-aos="fade-up">
      <h1 data-i18n="home">Home</h1>
      <p class="mb-3" data-i18n="welcomeParent">Order lunch ahead.</p>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn-app btn-primary-app" id="btnTopUpHero"><i class="bi bi-plus-lg"></i> <span data-i18n="topUp">Top Up</span></button>
        <a href="order.html" class="btn-app btn-outline-app" data-i18n="orderFood">Order Food</a>
      </div>
    </div>

    <div class="wallet-card mb-4" data-aos="fade-up">
      <div class="label" data-i18n="familyWallet">Family Wallet</div>
      <div class="balance" id="familyBalance">₪0</div>
      <div class="wallet-actions">
        <button type="button" class="btn-app btn-sm-app" id="btnTopUp" data-i18n="topUp">Top Up</button>
        <a href="wallet.html" class="btn-app btn-sm-app" data-i18n="wallet">Wallet</a>
      </div>
    </div>

    <h2 class="h5 mb-3" data-i18n="myChildren">My Children</h2>
    <div class="row g-3 mb-4" id="childrenHome"></div>

    <div class="card-app" data-aos="fade-up">
      <div class="card-app-header"><h3 data-i18n="history">Recent Activity</h3></div>
      <div class="card-app-body" id="activityList"></div>
    </div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script>$(function(){ ParentApp.initHome(); });</script>
</body>
</html>
