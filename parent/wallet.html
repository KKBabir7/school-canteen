<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet | Parent | SchoolFood</title>
  <meta name="description" content="Family wallet, child balances, top up and transfers.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="home.html" data-i18n="home">Home</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="wallet">Wallet</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-wallet2" aria-hidden="true"></i> Payments</p>
            <h1 data-i18n="wallet">Wallet</h1>
            <p>Family balance, child wallets, and recent activity.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn-app btn-primary-app" id="btnTopUp">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              <span data-i18n="topUp">Top Up</span>
            </button>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="wallet-card h-100" data-aos="fade-up">
              <div class="label" data-i18n="familyWallet">Family Wallet</div>
              <div class="balance" id="familyWalletBalance">₪0</div>
              <div class="wallet-actions">
                <button type="button" class="btn-app btn-sm-app" id="btnTopUpSide" data-i18n="topUp">Top Up</button>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card-app h-100" data-aos="fade-up">
              <div class="card-app-header">
                <h3><i class="bi bi-people" aria-hidden="true"></i> <span data-i18n="myChildren">Children wallets</span></h3>
              </div>
              <div class="card-app-body">
                <div class="parent-children-grid" id="childWallets"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card-app mt-4" data-aos="fade-up">
          <div class="card-app-header">
            <h3><i class="bi bi-clock-history" aria-hidden="true"></i> <span data-i18n="history">Activity</span></h3>
          </div>
          <div class="card-app-body" id="walletActivity"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script>$(function () { ParentApp.initWallet(); });</script>
</body>
</html>
