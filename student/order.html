<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Food | Student | SchoolFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="page-header">
      <div class="page-header-text"><h1 data-i18n="orderFood">Order Food</h1></div>
      <div class="d-flex align-items-center gap-2"><span class="text-muted small" data-i18n="wallet">Wallet</span><strong id="orderFamilyBal">₪0</strong></div>
    </div>
    <div class="filters-bar">
      <div class="filter-select flex-grow-1">
        <label class="form-label-app" data-i18n="student">Student</label>
        <select id="orderChildSelect" class="form-select-app"></select>
      </div>
      <div class="filter-select">
        <label class="form-label-app" data-i18n="today">Date</label>
        <select id="orderDateSelect" class="form-select-app">
          <option value="today" data-i18n="today">Today</option>
          <option value="tomorrow" data-i18n="tomorrow">Tomorrow</option>
        </select>
      </div>
    </div>
    <div class="order-food-grid">
      <div id="orderMenuSections"></div>
      <div class="card-app tray-sticky">
        <div class="card-app-header"><h3 data-i18n="tray">Tray</h3></div>
        <div class="card-app-body">
          <div id="trayItems"></div>
          <div class="d-flex justify-content-between mt-3"><strong data-i18n="total">Total</strong><strong id="trayTotal">₪0</strong></div>
          <button type="button" class="btn-app btn-primary-app w-100 mt-3" id="btnPlaceOrder" disabled data-i18n="placeOrder">Place Order</button>
        </div>
      </div>
    </div>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/menu-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/services/product-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>$(function(){ StudentApp.initOrder(); });</script>
</body>
</html>
