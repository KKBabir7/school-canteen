<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Student | SchoolFood</title>
  <meta name="description" content="Student profile — school, class, and account info.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="home.html" data-i18n="home">Home</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="profile">Profile</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-person-circle" aria-hidden="true"></i> Account</p>
            <h1 data-i18n="profile">Profile</h1>
            <p>School, class, and account details.</p>
          </div>
        </div>

        <div class="settings-layout" data-aos="fade-up">
          <aside class="settings-card settings-profile-card">
            <img id="profAvatar" class="settings-profile-photo" src="" alt="" width="88" height="88">
            <h3 id="profName">—</h3>
            <p class="settings-profile-role">Student</p>
            <p class="settings-profile-email" id="profEmail">—</p>
          </aside>
          <div class="settings-forms">
            <section class="settings-card">
              <h3><i class="bi bi-card-heading" aria-hidden="true"></i> Details</h3>
              <ul class="info-list mb-3">
                <li><span class="label" data-i18n="school">School</span><span class="value" id="profSchool">—</span></li>
                <li><span class="label" data-i18n="grade">Grade</span><span class="value" id="profGrade">—</span></li>
                <li><span class="label" data-i18n="class">Class</span><span class="value" id="profClass">—</span></li>
                <li><span class="label" data-i18n="studentCode">Student code</span><span class="value" id="profCode">—</span></li>
              </ul>
              <div class="form-group-app mb-0">
                <label class="form-label-app" for="stuLang">Preferred language</label>
                <select id="stuLang" class="select2-field" data-placeholder="Language">
                  <option value="en">English</option>
                  <option value="ar">العربية</option>
                </select>
              </div>
              <div class="mt-3">
                <button type="button" class="btn-app btn-primary-app btn-sm-app" id="btnSaveStuProfile">
                  <i class="bi bi-check2-circle" aria-hidden="true"></i>
                  <span data-i18n="saveChanges">Save</span>
                </button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>$(function () { StudentApp.initProfile(); });</script>
</body>
</html>
