      <div class="page-header-text"><h1 data-i18n="wallet">Wallet</h1></div>
      <a href="order.html" class="btn-app btn-primary-app" data-i18n="orderFood">Order Food</a>
    </div>

    <div class="wallet-card mb-4" data-aos="fade-up">
      <div class="label" data-i18n="balance">Balance</div>

    </div>

        <div class="stat-card-label"><span data-i18n="spentToday">Spent today</span></div>

      </div>
      <div class="stat-card">
        <div class="stat-card-label"><span data-i18n="dailyLimit">Daily limit</span></div>
