<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Student | SchoolFood</title>
  <meta name="description" content="Upcoming, past, and cancelled student orders.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="home.html" data-i18n="home">Home</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="myOrders">My Orders</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-receipt" aria-hidden="true"></i> Orders</p>
            <h1 data-i18n="myOrders">My Orders</h1>
            <p>Track preparing meals and past orders.</p>
          </div>
          <div class="page-actions">
            <a href="order.html" class="btn-app btn-primary-app">
              <i class="bi bi-cart3" aria-hidden="true"></i>
              <span data-i18n="orderFood">Order Food</span>
            </a>
          </div>
        </div>

        <div class="filters-bar" data-aos="fade-up">
          <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="searchStudentOrders" data-i18n-placeholder="search" placeholder="Search orders">
          </div>
          <div class="filter-select">
            <select id="studentOrderSort" class="select2-field" data-placeholder="Sort by">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="highest">Highest total</option>
              <option value="lowest">Lowest total</option>
            </select>
          </div>
        </div>

        <div class="tabs-app order-tabs" role="tablist">
          <button type="button" class="tab-btn active" data-tab="upcoming" data-i18n="upcomingOrders">Upcoming</button>
          <button type="button" class="tab-btn" data-tab="past" data-i18n="pastOrders">Past</button>
          <button type="button" class="tab-btn" data-tab="cancelled" data-i18n="cancelled">Cancelled</button>
        </div>

        <div id="studentOrders"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/services/child-service.js"></script>
  <script src="../assets/js/services/wallet-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/parent.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>$(function () { StudentApp.initOrders(); });</script>
</body>
</html>
