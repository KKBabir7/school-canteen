<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | School Admin | SchoolFood</title>
  <meta name="description" content="Orders from canteens at your school.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/ordering.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <div class="app-content">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb-app">
            <li><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            <li class="separator" aria-hidden="true">/</li>
            <li><span class="current" data-i18n="orders">Orders</span></li>
          </ol>
        </nav>

        <div class="page-header page-header--panel" data-aos="fade-up">
          <div class="page-header-text">
            <p class="page-kicker"><i class="bi bi-bag-check" aria-hidden="true"></i> Operations</p>
            <h1 data-i18n="orders">Orders</h1>
            <p data-i18n="schoolOrdersDesc">Orders from canteens at your school.</p>
          </div>
          <div class="page-actions">
            <a href="canteens.html" class="btn-app btn-outline-app">
              <i class="bi bi-shop-window" aria-hidden="true"></i>
              <span data-i18n="canteens">Canteens</span>
            </a>
          </div>
        </div>

        <div class="tabs-app order-tabs" role="tablist" id="fpOrderTabs">
          <button type="button" class="tab-btn active" data-tab="all"><span data-i18n="all">All</span></button>
          <button type="button" class="tab-btn" data-tab="new"><span data-i18n="newOrders">New</span> <span class="tab-count" id="count-new">0</span></button>
          <button type="button" class="tab-btn" data-tab="preparing"><span data-i18n="preparing">Preparing</span> <span class="tab-count" id="count-preparing">0</span></button>
          <button type="button" class="tab-btn" data-tab="ready"><span data-i18n="ready">Ready</span> <span class="tab-count" id="count-ready">0</span></button>
          <button type="button" class="tab-btn" data-tab="upcoming"><span data-i18n="upcoming">Upcoming</span> <span class="tab-count" id="count-upcoming">0</span></button>
          <button type="button" class="tab-btn" data-tab="completed"><span data-i18n="history">History</span> <span class="tab-count" id="count-completed">0</span></button>
        </div>

        <div class="filters-bar" data-aos="fade-up">
          <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="searchFpOrders" data-i18n-placeholder="search" placeholder="Search">
          </div>
          <div class="filter-select">
            <select id="saOrderCanteen" class="select2-field" data-placeholder="Canteen">
              <option value="all">All canteens</option>
            </select>
          </div>
          <div class="filter-select">
            <select id="fpOrderSort" class="select2-field" data-placeholder="Sort by">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="highest">Highest total</option>
              <option value="lowest">Lowest total</option>
            </select>
          </div>
        </div>

        <div id="fpOrdersList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/order-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/soon-features.js"></script>
  <script>$(function () { SoonFeatures.initProviderOrders('school'); });</script>
</body>
</html>
