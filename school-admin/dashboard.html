<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | School Admin | SchoolFood</title>
  <meta name="description" content="School admin dashboard — grades, classes, breaks, and canteens.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
  <link href="../assets/css/components.css" rel="stylesheet">
  <link href="../assets/css/forms.css" rel="stylesheet">
  <link href="../assets/css/rtl.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell"><div class="app-main"><div class="app-content">
    <div class="welcome-banner" data-aos="fade-up">
      <h2 id="saSchoolName">School</h2>
      <p data-i18n="welcomeSchoolAdmin">Manage grades, breaks, and canteens for your school.</p>
    </div>

    <div class="stat-grid">
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="grades">Grades</span></div>
        <div class="stat-card-value" id="statGrades">0</div>
      </div>
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="classes">Classes</span></div>
        <div class="stat-card-value" id="statClasses">0</div>
      </div>
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="breaks">Breaks</span></div>
        <div class="stat-card-value" id="statBreaks">0</div>
      </div>
      <div class="stat-card" data-aos="fade-up">
        <div class="stat-card-label"><span data-i18n="canteens">Canteens</span></div>
        <div class="stat-card-value" id="statCanteens">0</div>
      </div>
    </div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/services/canteen-service.js"></script>
  <script src="../assets/js/services/school-service.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/school-admin.js"></script>
  <script>$(function(){ SchoolAdminApp.initDashboard(); });</script>
</body>
</html>
